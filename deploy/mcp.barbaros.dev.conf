# Install at /etc/nginx/sites-available/mcp.barbaros.dev, symlink into
# sites-enabled, then `certbot --nginx -d mcp.barbaros.dev` (adds the SSL
# server block and the port-80 redirect automatically — this file starts
# as plain HTTP; certbot rewrites it in place).
#
# Requires deploy/mcp-ratelimit.conf installed at
# /etc/nginx/conf.d/mcp-barbaros-ratelimit.conf first (limit_req_zone must
# live in the http{} context, not here).

server {
    listen 80;
    server_name mcp.barbaros.dev;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 128k;

    location /privacymatrix/ {
        limit_req zone=barbaros_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:8101/privacymatrix/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8101/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}

# Install at /etc/nginx/conf.d/mcp-barbaros-ratelimit.conf (http context — cannot
# live inside a server{} block). Defense in depth; the app itself also rate-limits
# per IP on /privacymatrix/mcp (see src/server.ts).
limit_req_zone $binary_remote_addr zone=barbaros_mcp:10m rate=50r/s;

# mcp.barbaros.dev logs no client IP, user agent or referer (privacy policy, 2026-10-24).
log_format mcp_noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';
